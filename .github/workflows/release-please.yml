name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains an always-open "Release vX.Y.Z" PR that aggregates Conventional
      # Commits on main since the last release. Merging that PR bumps the version
      # in package.json + package-lock.json, promotes the CHANGELOG [Unreleased]
      # block to a dated section, and tags vX.Y.Z — which triggers publish.yml.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

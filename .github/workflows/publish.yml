name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The npm trusted publisher names this environment, and the environment only
    # admits main and v* tags, so npm accepts no publish from any other ref.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@^11.5.1

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # npm authenticates via the trusted publisher configured on npmjs.com for
      # this workflow (OIDC) and attaches provenance automatically. That
      # publisher must allow "npm publish", not only "npm stage publish". Once a
      # trusted publisher exists npm uses OIDC instead of NPM_TOKEN.
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run

      - name: Publish
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run)"
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

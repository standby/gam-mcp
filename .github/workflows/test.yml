name: test

# Runs on every pull request, including ones from forks. pull_request (not
# pull_request_target) gives fork PRs a read-only token and no secrets.
# workflow_dispatch lets release-please.yml run it on the release PR, whose
# GITHUB_TOKEN-made pushes trigger no pull_request event; `test` is a required
# check on main, so that PR could not merge otherwise.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
